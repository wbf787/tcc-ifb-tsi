name: Compilar TCC LaTeX

on:
  push:
    branches:
      - main # Executa a cada push no branch principal
  pull_request:
    branches:
      - main

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      # 1. Baixa o código do seu repositório para a máquina virtual do GitHub
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Compila o documento indicando a subpasta onde o principal.tex está
      - name: Compilar PDF do LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: principal.tex
          working_directory: ifb_tcc-template_2025_tcc_ifb_tsi # Diz para o GitHub entrar nesta pasta antes de compilar

      # 3. Guarda o PDF gerado (principal.pdf) como artefato para download
      - name: Upload do PDF Compilado
        uses: actions/upload-artifact@v4
        with:
          name: TCC_Final_PDF
          path: ifb_tcc-template_2025_tcc_ifb_tsi/principal.pdf # Caminho do PDF gerado dentro da subpasta
