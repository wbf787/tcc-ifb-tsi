name: Compilar TCC LaTeX

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Compilar PDF do LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: principal.tex
          working_directory: ifb_tcc-template_2025_tcc_ifb_tsi
          compiler: xelatex
          # Força o uso do TeX Live 2022, onde o regexpatch funciona perfeitamente
          image: ghcr.io/xu-cheng/texlive-full:2022

      - name: Upload do PDF Compilado
        uses: actions/upload-artifact@v4
        with:
          name: TCC_Final_PDF
          path: ifb_tcc-template_2025_tcc_ifb_tsi/principal.pdf
